[project]
name = "financial_advisor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "yfinance>=0.2.50",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.9.0",
    "slowapi>=0.1.9",
    "loguru>=0.7.0",
    "pydantic[email]>=2.0.0",
    "alembic>=1.18.4",
    "psycopg[binary]>=3.3.3",
    "anthropic>=2.3.0",
    "pgvector>=0.5.1",
    "numpy>=2.4.4",
    "rapidfuzz>=3.14.6",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "freezegun>=1.5.0",
    "pymupdf>=2.0",
    "pytest-mock>=3.17.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "pg: needs Postgres + pgvector (set PG_TEST_URL); run with `pytest -m pg`",
    "live: calls paid external APIs; skipped in CI",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
