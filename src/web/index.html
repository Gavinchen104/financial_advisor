<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Advisor — Stock Briefs for New Investors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .prose h2 { font-size: 1rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.25rem; color: #111827; }
    .prose p { margin-bottom: 0.75rem; color: #374151; line-height: 1.6; }
    .prose em { color: #6b7280; font-style: normal; font-size: 0.8rem; }
    .prose hr { margin: 1rem 0; border-color: #e5e7eb; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <div class="max-w-5xl mx-auto px-4 py-12">

    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Financial Advisor</h1>
      <p class="text-gray-400 text-sm mt-1">Plain-English stock briefs for first-year investors</p>
    </div>

    <form id="brief-form" class="flex flex-wrap gap-2 mb-6">
      <input
        id="ticker-input"
        type="text"
        placeholder="Ticker (e.g. NVDA)"
        maxlength="5"
        autocomplete="off"
        spellcheck="false"
        class="border border-gray-300 rounded-lg px-4 py-2.5 text-sm uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500 w-40"
      />
      <button type="submit" id="submit-btn"
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors disabled:opacity-40">
        Get Brief
      </button>
    </form>

    <div id="status" class="hidden text-sm text-gray-400 mb-4">Generating — this may take up to 60 seconds...</div>
    <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4"></div>

    <div id="brief-output" class="hidden bg-white rounded-xl border border-gray-200 shadow-sm px-6 py-5 prose mb-6"></div>

    <div id="context-panel" class="hidden bg-white rounded-xl border border-gray-200 shadow-sm px-6 py-5">
      <h2 class="text-base font-bold text-gray-900 mb-1">Knowledge graph context</h2>
      <p class="text-xs text-gray-400 mb-4">Related companies and macro factors with 7-day price changes.</p>
      <div id="context-body"></div>
    </div>

  </div>

  <script>
    const form = document.getElementById('brief-form');
    const input = document.getElementById('ticker-input');
    const submitBtn = document.getElementById('submit-btn');
    const status = document.getElementById('status');
    const errDiv = document.getElementById('error');
    const briefOutput = document.getElementById('brief-output');
    const contextPanel = document.getElementById('context-panel');
    const contextBody = document.getElementById('context-body');

    input.addEventListener('input', () => {
      input.value = input.value.toUpperCase().replace(/[^A-Z.]/g, '');
    });

    function setLoading(on) {
      submitBtn.disabled = on;
      status.classList.toggle('hidden', !on);
      errDiv.classList.add('hidden');
    }

    function showError(msg) {
      errDiv.textContent = msg;
      errDiv.classList.remove('hidden');
    }

    function fmtPct(p) {
      if (p === null || p === undefined) return '<span class="text-gray-400">—</span>';
      const cls = p > 0 ? 'text-green-600' : (p < 0 ? 'text-red-600' : 'text-gray-500');
      const sign = p > 0 ? '+' : '';
      return `<span class="${cls} font-mono">${sign}${p.toFixed(2)}%</span>`;
    }

    function renderRelatedList(title, items, tickerKey) {
      if (!items || items.length === 0) return '';
      const rows = items.map(it => `
        <tr class="border-b border-gray-100 last:border-0">
          <td class="py-1.5 pr-3 font-mono text-xs text-gray-900">${it[tickerKey] || '—'}</td>
          <td class="py-1.5 pr-3 text-xs text-gray-700">${it.name || ''}</td>
          <td class="py-1.5 pr-3 text-xs text-gray-500">${it.relationship_label || ''}</td>
          <td class="py-1.5 text-right text-xs">${fmtPct(it.pct_change_7d)}</td>
        </tr>`).join('');
      return `
        <div class="mb-5">
          <h3 class="text-sm font-semibold text-gray-800 mb-2">${title}</h3>
          <table class="w-full text-left"><tbody>${rows}</tbody></table>
        </div>`;
    }

    function renderMacro(items) {
      if (!items || items.length === 0) return '';
      const rows = items.map(it => `
        <tr class="border-b border-gray-100 last:border-0">
          <td class="py-1.5 pr-3 text-xs text-gray-900">${it.factor_name || it.factor_id}</td>
          <td class="py-1.5 pr-3 text-xs text-gray-500">${it.direction || ''}</td>
          <td class="py-1.5 pr-3 text-xs text-gray-500">${it.reason || ''}</td>
          <td class="py-1.5 text-right text-xs">${fmtPct(it.pct_change_7d)}</td>
        </tr>`).join('');
      return `
        <div class="mb-1">
          <h3 class="text-sm font-semibold text-gray-800 mb-2">Macro factors</h3>
          <table class="w-full text-left"><tbody>${rows}</tbody></table>
        </div>`;
    }

    function renderContext(data) {
      if (!data || data.error) {
        contextBody.innerHTML = `<p class="text-sm text-gray-500">${data?.error || 'No context available.'}</p>`;
        contextPanel.classList.remove('hidden');
        return;
      }
      const header = `
        <p class="text-xs text-gray-500 mb-4">
          <span class="font-mono">${data.ticker}</span> — ${data.company_name || ''}
          ${data.sector ? `· <span class="text-gray-400">${data.sector}</span>` : ''}
          ${data.sub_industry ? `· <span class="text-gray-400">${data.sub_industry}</span>` : ''}
        </p>`;
      contextBody.innerHTML = header
        + renderRelatedList('Competitors', data.competitors, 'ticker')
        + renderRelatedList('Key suppliers', data.key_suppliers, 'ticker')
        + renderRelatedList('Key customers', data.key_customers, 'ticker')
        + renderMacro(data.macro_factors);
      contextPanel.classList.remove('hidden');
    }

    async function fetchContext(ticker) {
      try {
        const resp = await fetch(`/context/${encodeURIComponent(ticker)}`);
        if (!resp.ok) return;
        renderContext(await resp.json());
      } catch (_) { /* silent — context is optional */ }
    }

    async function fetchBrief(ticker) {
      const resp = await fetch('/brief', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker, experience_level: 'first_year' }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      const data = await resp.json();
      briefOutput.innerHTML = marked.parse(data.full_brief);
      briefOutput.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const ticker = input.value.trim();
      if (!ticker) return;

      setLoading(true);
      briefOutput.classList.add('hidden');
      contextPanel.classList.add('hidden');
      contextBody.innerHTML = '';

      // Fire both in parallel. Context is fast (~2s) and shows first.
      fetchContext(ticker);
      try {
        await fetchBrief(ticker);
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
