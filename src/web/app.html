<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DinoDigest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* App shell layout */
    .app-shell { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
    .sidebar {
      background: var(--bg-subtle);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1rem;
      display: flex; flex-direction: column; gap: 0.3rem;
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.25rem 0.3rem 1.5rem;
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 600;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.7rem;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.12s;
      text-decoration: none;
    }
    .nav-item:hover { background: var(--border); color: var(--text); text-decoration: none; }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
    .nav-item-icon { font-size: 1rem; width: 18px; text-align: center; }
    .sidebar-bottom { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.82rem; color: var(--text-soft); }
    .main { padding: 2rem 2.5rem; overflow-y: auto; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .page-title { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 500; }
    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; overflow-x: auto; padding: 0.75rem 1rem; border-right: none; border-bottom: 1px solid var(--border); }
      .sidebar-brand { padding: 0.25rem 0.5rem 0.25rem 0; border-right: 1px solid var(--border); margin-right: 0.5rem; }
      .sidebar-bottom { display: none; }
      .main { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="nav-brand-logo">D</div>
        DinoDigest
      </div>
      <a class="nav-item" data-route="dashboard"><span class="nav-item-icon">◉</span>Dashboard</a>
      <a class="nav-item" data-route="watchlist"><span class="nav-item-icon">★</span>Watchlist</a>
      <a class="nav-item" data-route="portfolio"><span class="nav-item-icon">▤</span>Portfolio</a>
      <a class="nav-item" data-route="alerts"><span class="nav-item-icon">◈</span>Alerts</a>
      <a class="nav-item" data-route="compare"><span class="nav-item-icon">⇄</span>Compare</a>
      <div class="sidebar-bottom">
        <div id="user-info" class="mb-1"></div>
        <div class="flex items-center gap-1">
          <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌓</button>
          <button class="btn btn-ghost btn-sm" id="logout-btn">Log out</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" id="main"></main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
