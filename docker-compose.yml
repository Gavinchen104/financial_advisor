services:
  db:
    # pgvector >= 0.7 (halfvec) is required by the RAG tables (docs/PROJECT2-PLAN.md §4)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockify_dev}
      POSTGRES_DB: ${POSTGRES_DB:-stockify}
    # Published on loopback only, so `uv run …` can use DATABASE_URL=…@localhost:5432.
    # If a native Postgres (e.g. Homebrew) already holds 5432, stop it or change the
    # host port here and in .env.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockify}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # The app container reaches Postgres at the `db` service host. A local .env
      # usually sets DATABASE_URL to localhost for `uv run`, so that variable is
      # deliberately NOT used here; set APP_DATABASE_URL to point the container elsewhere.
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://stockify:stockify_dev@db:5432/stockify}
      ENV: ${ENV:-prod}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
