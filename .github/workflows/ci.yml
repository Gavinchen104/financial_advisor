name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    name: Lint & import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Check all modules import cleanly
        run: |
          uv run python -c "
          from src.tools.news import get_recent_news
          from src.tools.filings import get_latest_filing
          from src.tools.price import get_price_action, get_earnings_data
          from src.tools.brief_writer import parse_brief
          from src.agent import run_agent
          from src.api import app
          print('All imports OK')
          "
        env:
          GEMINI_API_KEY: dummy-key-for-import-check

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: lint-and-import
    if: github.event_name == 'push' && vars.RUN_SMOKE_TESTS == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run smoke tests
        run: uv run python scripts/smoke_test.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
