name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    name: Lint & import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Check all modules import cleanly
        run: |
          uv run python -c "
          from src.tools.news import get_recent_news
          from src.tools.filings import get_latest_filing
          from src.tools.price import get_price_action, get_earnings_data
          from src.tools.brief_writer import parse_brief
          from src.agent import run_agent
          from src.api import app
          from src.rag import config, llm
          print('All imports OK')
          "
        env:
          GEMINI_API_KEY: dummy-key-for-import-check

  pytest:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    needs: lint-and-import
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies (including dev)
        run: uv sync --all-extras --dev

      - name: Run pytest
        run: uv run pytest -q --cov=src --cov-report=term-missing
        env:
          GEMINI_API_KEY: dummy-key-not-used-in-tests
          SECRET_KEY: test-secret-key-long-enough-for-jwt
          ENV: dev

  pytest-pg:
    name: Postgres + pgvector tests
    runs-on: ubuntu-latest
    needs: lint-and-import
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stockify
          POSTGRES_PASSWORD: stockify_dev
          POSTGRES_DB: stockify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies (including dev)
        run: uv sync --all-extras --dev

      - name: Run Postgres-backed tests (RAG schema, pgvector)
        run: uv run pytest -q -m pg
        env:
          # conftest.py always points DATABASE_URL at SQLite; PG_TEST_URL is the
          # pgvector service. When it is set, the pg tests must run (no skipping).
          PG_TEST_URL: postgresql+psycopg://stockify:stockify_dev@localhost:5432/stockify_test
          GEMINI_API_KEY: dummy-key-not-used-in-tests
          ANTHROPIC_API_KEY: dummy-key-not-used-in-tests
          SECRET_KEY: test-secret-key-long-enough-for-jwt
          ENV: dev
