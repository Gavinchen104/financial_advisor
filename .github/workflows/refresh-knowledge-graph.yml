name: Refresh knowledge graph

on:
  schedule:
    # Weekly: Sunday 06:00 UTC (Saturday evening US)
    - cron: '0 6 * * 0'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  rebuild-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Rebuild S&P 500 knowledge graph
        run: uv run python scripts/build_knowledge_graph.py

      - name: Commit updated graph if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/knowledge_graph/data/sp500_graph.json; then
            echo "No changes to knowledge graph."
          else
            git add src/knowledge_graph/data/sp500_graph.json
            git commit -m "chore: weekly knowledge graph refresh"
            git push
          fi
