name: Refresh news cache

on:
  schedule:
    # Daily: 13:00 UTC (post-market-open NYC)
    - cron: '0 13 * * *'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Pre-warm news cache for hot-list tickers
        run: uv run python scripts/refresh_news_cache.py

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/knowledge_graph/data/news_cache.json; then
            echo "No changes to news cache."
          else
            git add src/knowledge_graph/data/news_cache.json
            git commit -m "chore: daily news cache refresh"
            git push
          fi
